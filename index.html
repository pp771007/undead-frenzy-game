<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>亡靈狂潮 (Undead Frenzy)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description" content="體驗黑暗奇幻生存！《亡靈狂潮》讓你扮演死靈法師，召喚不死生物對抗怪物潮。收集靈魂、強化僕從，挑戰你的生存極限！">
    <meta name="theme-color" content="#140f1c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            --ink: #0e0a14;
            --bone: #f4ecd8;
            --bone-dim: #b9ae96;
            --gold: #e9c46a;
            --gold-deep: #9c7a3c;
            /* 小字壓在戰場上：四邊 1px 描邊＋一點落影。單純往下 2px 的陰影在小字上會像重影 */
            --text-outline: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 2px rgba(0, 0, 0, 0.5);
            --soul: #7ff0f0;
            --blood: #e04848;
            --panel-top: #2f2342;
            --panel-bottom: #1b1426;
            --purple: #8e44ad;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* 字級固定 100px、行高 1 的隱形探針：實際畫出來的高度 ÷ 100 = 這支手機把字放大的倍率 */
        #tz-probe {
            position: absolute;
            left: -9999px;
            top: 0;
            display: inline-block;
            visibility: hidden;
            font-size: 100px;
            line-height: 1;
            pointer-events: none;
        }

        body {
            position: fixed;
            inset: 0;
            background: #140f1c;
            color: var(--bone);
            font-family: var(--font-ui);
            -webkit-user-select: none;
            user-select: none;
        }

        .hidden {
            display: none !important;
        }

        #gameCanvas {
            position: fixed;
            inset: 0;
            display: block;
            touch-action: none;
            background: #221e1a;
        }

        /* ---------- 圖示 ---------- */
        .icon,
        [data-icon] {
            display: inline-flex;
            width: 1.2em;
            height: 1.2em;
            flex-shrink: 0;
        }

        .icon svg,
        [data-icon] svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ---------- 共用：面板 ---------- */
        .panel {
            position: relative;
            background: linear-gradient(var(--panel-top), var(--panel-bottom));
            border: 3px solid var(--ink);
            border-radius: 16px;
            box-shadow:
                inset 0 0 0 2px var(--gold-deep),
                inset 0 0 0 4px var(--ink),
                inset 0 6px 18px rgba(255, 255, 255, 0.05),
                0 12px 32px rgba(0, 0, 0, 0.6);
        }

        .title-text {
            font-family: var(--font-display);
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(233, 196, 106, 0.35);
            letter-spacing: 0.06em;
        }

        /* ---------- 共用：按鈕 ---------- */
        button {
            font-family: inherit;
            color: inherit;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .btn {
            --btn-top: #6b4f8a;
            --btn-bottom: #4a3463;
            --btn-edge: #2b1d3b;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 44px;
            padding: 4px 16px 8px;
            border: 3px solid var(--ink);
            border-radius: 12px;
            background: linear-gradient(var(--btn-top), var(--btn-bottom));
            /* 厚度畫在外框「裡面」(inset)，外面只有一圈跟外框同色的底：厚度跑到外框外的話看起來像兩顆按鈕疊歪 */
            box-shadow: var(--btn-shadow);
            --btn-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.3), inset 0 -4px 0 var(--btn-edge), 0 3px 0 var(--ink), 0 6px 10px rgba(0, 0, 0, 0.4);
            color: var(--bone);
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 16px;
            text-shadow: var(--text-outline);
            cursor: pointer;
            transition: transform 0.06s, box-shadow 0.06s, filter 0.15s;
        }

        .btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.2), inset 0 -2px 0 var(--btn-edge), 0 1px 0 var(--ink), 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .btn:disabled {
            filter: grayscale(0.85) brightness(0.65);
            cursor: default;
        }

        .btn-gold {
            --btn-top: #f2cf73;
            --btn-bottom: #c4913a;
            --btn-edge: #7a5520;
            color: #3a2410;
            text-shadow: 0 1px 0 rgba(255, 240, 200, 0.5);
        }

        .btn-green {
            --btn-top: #8fcf5a;
            --btn-bottom: #4e9a2e;
            --btn-edge: #2c5c18;
        }

        .btn-blue {
            --btn-top: #5aa9e6;
            --btn-bottom: #2f6fb3;
            --btn-edge: #1b3f6b;
        }

        .btn-red {
            --btn-top: #e66a5a;
            --btn-bottom: #b23a2e;
            --btn-edge: #6b1e17;
        }

        .btn-dark {
            --btn-top: #3a3046;
            --btn-bottom: #261e30;
            --btn-edge: #120d18;
        }

        .btn-big {
            min-height: 56px;
            font-size: 20px;
            border-radius: 14px;
        }

        .btn-icon {
            width: 22px;
            height: 22px;
        }

        .price {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-family: var(--font-display);
        }

        .price .icon {
            width: 15px;
            height: 15px;
        }

        /* ---------- HUD ---------- */
        #hud-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            padding: calc(env(safe-area-inset-top) + 8px) 8px 18px;
            background: linear-gradient(rgba(14, 10, 20, 0.75), rgba(14, 10, 20, 0));
            pointer-events: none;
        }

        .hud-chip {
            display: flex;
            align-items: center;
            height: 34px;
            padding: 0 10px 0 4px;
            gap: 6px;
            background: linear-gradient(#2a2036, #17111f);
            border: 2px solid var(--ink);
            border-radius: 17px;
            box-shadow: inset 0 0 0 1.5px var(--gold-deep), 0 3px 8px rgba(0, 0, 0, 0.5);
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 17px;
            text-shadow: var(--text-outline);
        }

        .chip-icon {
            width: 30px;
            height: 30px;
            margin-left: -2px;
            filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.4));
        }

        /* 上方一列在窄螢幕排不下時，由血量這塊讓位（法師腳下另有血條）；波次與靈魂數不縮，數字才不會被切掉 */
        .hp-chip {
            flex: 0 1 auto;
            min-width: 0;
        }

        #wave-plate,
        .hud-right {
            flex: none;
        }

        .hp-chip .hp-bar {
            flex: 1 1 92px;
            min-width: 44px;
        }

        .hp-bar {
            position: relative;
            width: 92px;
            height: 16px;
            background: #120d18;
            border: 2px solid var(--ink);
            border-radius: 8px;
            overflow: hidden;
        }

        #hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(#ff7a7a, #c62f2f);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
            transition: width 0.2s;
        }

        #player-health-info {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-family: var(--font-ui);
            font-weight: 800;
            text-shadow: 0 1px 2px #000;
        }

        #wave-plate {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 14px 3px 6px;
            background: linear-gradient(#2a2036, #17111f);
            border: 2px solid var(--ink);
            border-radius: 12px;
            box-shadow: inset 0 0 0 1.5px var(--gold-deep), 0 3px 8px rgba(0, 0, 0, 0.5);
        }

        #wave-plate.urgent {
            animation: plate-urgent 0.5s ease-in-out infinite alternate;
        }

        #wave-plate.urgent #timer-info {
            color: #ffab91;
        }

        /* 戰場停住時（暫停、選祝福、凱旋），疊在後面的 HUD 也跟著停 */
        body.world-frozen #hud,
        body.world-frozen #hud * {
            animation-play-state: paused !important;
        }

        @keyframes plate-urgent {
            from { box-shadow: inset 0 0 0 1.5px var(--gold-deep), 0 3px 8px rgba(0, 0, 0, 0.5); }
            to { box-shadow: inset 0 0 0 1.5px #ff7043, 0 0 14px rgba(255, 112, 67, 0.7); }
        }

        #wave-plate .plate-icon {
            width: 30px;
            height: 30px;
        }

        #wave-info {
            white-space: nowrap;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 17px;
            line-height: 1.1;
            color: var(--gold);
            text-shadow: var(--text-outline);
        }

        #timer-info {
            font-size: 11px;
            color: var(--bone-dim);
            line-height: 1.2;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        #souls-info {
            min-width: 30px;
            color: var(--soul);
        }

        #souls-info.bump,
        #crystals-info.bump {
            animation: bump 0.25s;
        }

        .crystal-chip {
            color: #e1d0ff;
        }

        /* 結算：結晶是怎麼算出來的，一項一行 */
        .reward-detail {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 12px;
            margin-top: 10px;
            font-size: 13px;
            color: var(--bone-dim);
        }

        .reward-detail span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .reward-detail .icon {
            width: 16px;
            height: 16px;
        }

        .reward-detail b {
            color: #e1d0ff;
        }

        /* 強化畫面頂端：結晶從哪來 */
        .meta-earn {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 14px;
            margin: -4px 0 10px;
            font-size: 13px;
            color: var(--bone-dim);
        }

        .meta-earn span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .meta-earn .icon {
            width: 16px;
            height: 16px;
        }

        /* 有結晶夠買東西時，進強化畫面的按鈕亮起來 */
        .btn.can-upgrade {
            animation: good-deal 0.9s ease-in-out infinite alternate;
        }

        #pause-resume-btn {
            pointer-events: auto;
            min-height: 32px;
            padding: 2px 10px 2px 6px;
            font-size: 13px;
            border-width: 2px;
            border-radius: 10px;
        }

        #pause-resume-btn .btn-icon {
            width: 16px;
            height: 16px;
        }

        #hud-bottom {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 18px 8px calc(env(safe-area-inset-bottom) + 8px);
            background: linear-gradient(rgba(14, 10, 20, 0), rgba(14, 10, 20, 0.6) 40%);
            pointer-events: none;
        }

        #action-row {
            position: relative;
            width: 100%;
            max-width: 560px;
            min-height: 72px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #skip-wave-btn {
            pointer-events: auto;
            border-radius: 22px;
            padding: 6px 20px 6px 14px;
        }

        #nova-btn {
            pointer-events: auto;
            position: absolute;
            right: 0;
            bottom: 0;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            background: #1d1628;
            box-shadow: inset 0 0 0 2px var(--gold-deep), 0 4px 0 #0b0810, 0 6px 12px rgba(0, 0, 0, 0.5);
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 14px;
            text-shadow: var(--text-outline);
            cursor: pointer;
        }

        #nova-btn .icon {
            width: 34px;
            height: 34px;
        }

        #nova-btn.nova-ready {
            background: radial-gradient(circle at 50% 35%, #b55ce6, #5e2385);
            box-shadow: inset 0 0 0 2px var(--gold), 0 4px 0 #2e0f45, 0 0 18px rgba(192, 107, 245, 0.75);
            animation: nova-glow 1.6s ease-in-out infinite;
        }

        #nova-btn:active {
            transform: translateY(3px);
        }

        #unit-cards {
            pointer-events: auto;
            width: 100%;
            max-width: 560px;
            display: flex;
            gap: 6px;
        }

        .unit-card {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 6px;
            border-radius: 14px;
        }

        .unit-head {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .portrait {
            position: relative;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 50%;
            background: radial-gradient(#4a3a5e, #1d1628);
            border: 2px solid var(--ink);
            box-shadow: inset 0 0 0 1.5px var(--gold-deep);
        }

        .portrait img {
            position: absolute;
            inset: 3px;
            width: calc(100% - 6px);
            height: calc(100% - 6px);
            object-fit: contain;
        }

        .lv-badge {
            position: absolute;
            right: -6px;
            bottom: -4px;
            min-width: 20px;
            height: 18px;
            padding: 0 4px;
            border-radius: 9px;
            background: linear-gradient(#f2cf73, #c4913a);
            border: 2px solid var(--ink);
            color: #3a2410;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 11px;
            line-height: 14px;
            text-align: center;
        }

        .lv-badge.pop {
            animation: pop 0.35s;
        }

        .unit-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            gap: 1px;
        }

        .unit-name {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 14px;
            text-shadow: var(--text-outline);
            white-space: nowrap;
        }

        .unit-stars {
            display: flex;
            align-items: center;
            gap: 1px;
            font-size: 10px;
            color: var(--bone-dim);
            white-space: nowrap;
        }

        .unit-stars .icon {
            width: 12px;
            height: 12px;
        }

        .unit-stars .icon.off {
            filter: grayscale(1) brightness(0.45);
        }

        /* 數量做成頭像左上角的小標籤：卡片很窄，跟名字排同一列時三位數就會疊在名字上 */
        .unit-count {
            position: absolute;
            top: -6px;
            left: -6px;
            min-width: 20px;
            height: 17px;
            padding: 0 4px;
            border-radius: 9px;
            background: #1b1424;
            border: 1.5px solid var(--bone-dim);
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 11px;
            line-height: 14px;
            text-align: center;
            color: var(--bone);
            white-space: nowrap;
        }

        .unit-btns {
            display: flex;
            gap: 4px;
        }

        /* 只有「修練」的卡（等級是主角自己的能力）：沒有召喚鈕、沒有數量 */
        .unit-card.upgrade-only [data-act="summon"],
        .unit-card.upgrade-only .unit-count {
            display: none;
        }

        .unit-btns .btn {
            flex: 1;
            min-width: 0;
            min-height: 46px;
            padding: 1px 2px 5px;
            flex-direction: column;
            gap: 0;
            font-size: 13px;
            border-width: 2px;
            border-radius: 10px;
            line-height: 1.15;
        }

        .unit-btns .btn .price {
            font-size: 13px;
        }

        .unit-btns .btn.cant-afford {
            --btn-top: #3a3046;
            --btn-bottom: #261e30;
            --btn-edge: #120d18;
        }

        .unit-btns .btn.cant-afford .price {
            color: #ff8a80;
        }

        .deny-shake {
            animation: deny-shake 0.28s ease-in-out;
        }

        @keyframes deny-shake {
            0%, 100% { translate: 0 0; }
            25% { translate: -4px 0; }
            50% { translate: 4px 0; }
            75% { translate: -2px 0; }
        }

        /* 長按召喚／升級時浮在按鈕上方的倍數：召喚綠、升級金，跟按鈕同色 */
        #hold-combo {
            position: fixed;
            z-index: 6;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 14px 3px 5px;
            border-radius: 999px;
            border: 3px solid var(--ink);
            background: linear-gradient(var(--panel-top), var(--panel-bottom));
            box-shadow: inset 0 0 0 2px var(--hc-color), 0 4px 0 var(--ink), 0 0 18px var(--hc-glow);
            transform: translate(-50%, -100%);
            font-family: var(--font-display);
            font-weight: 900;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #hold-combo.show {
            opacity: 1;
            transition: opacity 0.08s;
        }

        #hold-combo.summon {
            --hc-color: #8fcf5a;
            --hc-glow: rgba(143, 207, 90, 0.55);
        }

        #hold-combo.upgrade {
            --hc-color: #f2cf73;
            --hc-glow: rgba(242, 207, 115, 0.55);
        }

        #hold-combo .hc-art,
        #hold-combo .hc-art img,
        #hold-combo .hc-art svg {
            display: block;
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        #hold-combo .hc-x {
            font-size: 18px;
            color: var(--bone-dim);
            text-shadow: var(--text-outline);
        }

        #hold-combo .hc-n {
            font-size: 28px;
            line-height: 1;
            color: var(--hc-color);
            text-shadow: var(--text-outline), 0 0 10px var(--hc-glow);
        }

        #hold-combo .hc-n.bump {
            animation: bump 0.18s ease-out;
        }

        /* 每滿 10 下整個標籤大彈一下；translate 要跟著寫，不然動畫期間標籤會跳離按鈕 */
        #hold-combo.milestone {
            animation: combo-milestone 0.35s ease-out;
        }

        @keyframes combo-milestone {
            0% { transform: translate(-50%, -100%) scale(1); }
            40% { transform: translate(-50%, -100%) scale(1.35); filter: brightness(1.6); }
            100% { transform: translate(-50%, -100%) scale(1); }
        }

        /* #nova-btn.nova-ready 的發光動畫比這條具體，要另外寫一條才蓋得過 */
        .hint-pulse, #nova-btn.hint-pulse {
            animation: hint 1s ease-in-out infinite;
        }

        /* 升級划算：一直帶著金光、一明一暗地呼吸，任何時候瞄一眼都看得出來 */
        .unit-btns .btn.good-deal {
            animation: good-deal 0.9s ease-in-out infinite alternate;
        }

        @keyframes good-deal {
            from { box-shadow: var(--btn-shadow), 0 0 0 2px #fff3b0, 0 0 8px 2px rgba(255, 213, 79, 0.55); filter: brightness(1); }
            to { box-shadow: var(--btn-shadow), 0 0 0 2px #fff3b0, 0 0 18px 6px rgba(255, 213, 79, 0.95); filter: brightness(1.18); }
        }

        /* ---------- 小提示 ---------- */
        #message-area {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 76px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: none;
            padding: 8px 16px;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 15px;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: var(--text-outline);
        }

        /* 成就達成：從狀態列下方滑進來，幾秒後自己收掉 */
        /* 疊在所有視窗之上（確認框除外）：在標題畫面、強化畫面買強化時也會達成 */
        #achv-toast {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 70px);
            left: 50%;
            z-index: 16;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            max-width: calc(100vw - 32px);
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -16px);
            border-color: var(--gold);
        }

        #achv-toast.show {
            animation: achv-toast 2.6s ease-out forwards;
        }

        @keyframes achv-toast {
            0% { opacity: 0; transform: translate(-50%, -16px); }
            10%, 85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -16px); }
        }

        #achv-toast>.icon {
            width: 30px;
            height: 30px;
            flex: none;
        }

        .achv-toast-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .achv-toast-text b {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 15px;
            color: var(--gold);
        }

        .achv-toast-text span {
            white-space: nowrap;
            font-size: 12px;
            color: var(--bone-dim);
        }

        #achv-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            max-height: 60vh;
            overflow-y: auto;
        }

        /* 類別分頁：橫向一排可以滑，每頁寫拿了幾個；全拿完的那一頁變金色 */
        #achv-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 4px;
            scrollbar-width: none;
        }

        .achv-tab {
            flex: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 10px;
            border-radius: 10px;
            border: 2px solid var(--ink);
            background: rgba(0, 0, 0, 0.35);
            color: var(--bone-dim);
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
        }

        .achv-tab span {
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 11px;
        }

        .achv-tab.on {
            color: var(--bone);
            border-color: var(--bone-dim);
            background: rgba(255, 255, 255, 0.1);
        }

        .achv-tab.full {
            color: var(--gold);
            border-color: rgba(233, 196, 106, 0.7);
        }

        .achv-icon {
            width: 40px;
            height: 40px;
            flex: none;
        }

        .achv-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .achv-row {
            opacity: 0.55;
        }

        /* 職業分頁裡每個職業的標題 */
        .achv-group {
            margin: 14px 0 6px;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 15px;
            color: var(--gold);
            text-align: left;
        }

        .achv-group:first-child {
            margin-top: 0;
        }

        .achv-row.done {
            opacity: 1;
            border-color: rgba(233, 196, 106, 0.7);
        }

        .achv-row>.icon {
            width: 40px;
            height: 40px;
        }

        /* ---------- 全畫面視窗 ---------- */
        .overlay-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px);
            background: radial-gradient(ellipse at center, rgba(20, 12, 30, 0.75), rgba(8, 5, 12, 0.92));
            text-align: center;
        }

        .overlay-content {
            width: 100%;
            max-width: 480px;
            max-height: 100%;
            overflow-y: auto;
            padding: 22px 18px 20px;
        }

        .overlay-content h2 {
            margin: 0 0 14px;
            font-size: 26px;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        /* 從結算 / 標題開出來的視窗要蓋在它們上面 */
        #meta-screen,
        #settings-screen,
        #curse-screen {
            z-index: 15;
        }

        /* 通關 / 詛咒 */
        .title-text.victory,
        #game-over-screen .title-text.victory {
            font-size: 40px;
            color: #ffd27a;
            text-shadow: 0 3px 0 var(--ink), 0 0 22px rgba(255, 196, 80, 0.7);
        }

        .victory-sub {
            color: var(--bone-dim);
            margin: 2px 0 10px;
        }

        .reward-line.curse-unlock {
            background: rgba(229, 57, 53, 0.15);
            border-color: rgba(239, 83, 80, 0.6);
            color: #ffcdd2;
        }

        .curse-stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 12px;
        }

        .curse-stepper .btn {
            width: 52px;
            font-size: 26px;
            padding: 0 0 4px;
        }

        #curse-level {
            min-width: 56px;
            text-align: center;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 40px;
            color: #ff8a80;
            text-shadow: var(--text-outline);
        }

        #curse-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 52vh;
            overflow-y: auto;
        }

        .curse-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--ink);
            opacity: 0.45;
        }

        .curse-row.on {
            opacity: 1;
            border-color: rgba(239, 83, 80, 0.75);
            background: rgba(183, 28, 28, 0.22);
        }

        .curse-row.locked {
            opacity: 0.3;
        }

        .curse-row>.icon {
            width: 30px;
            height: 30px;
        }

        .curse-row .lv {
            min-width: 18px;
            font-family: var(--font-display);
            font-weight: 900;
            color: #ff8a80;
        }

        .curse-row .meta-desc {
            flex: 1;
            text-align: left;
        }

        /* 標題畫面 */
        #title-screen {
            background: radial-gradient(ellipse at 50% 40%, rgba(40, 20, 60, 0.35), rgba(8, 5, 12, 0.85));
        }

        .logo {
            margin: 0;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(48px, 15vw, 84px);
            line-height: 1;
            letter-spacing: 0.08em;
            background: linear-gradient(#fff3c4, #e9c46a 45%, #9c6a2c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 0 #0e0a14) drop-shadow(0 0 18px rgba(192, 107, 245, 0.6));
        }

        .logo-sub {
            margin-top: 8px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5em;
            color: #c9a7e8;
            text-shadow: var(--text-outline);
        }

        .title-hero {
            width: 120px;
            height: auto;
            margin: 14px auto 0;
            display: block;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 20px rgba(192, 107, 245, 0.45));
            animation: float 3s ease-in-out infinite;
        }

        /* 選職業：一排小頭像，選中的金框；還沒解鎖的暗下來、壓一個鎖 */
        #class-picker {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .class-pick {
            position: relative;
            width: 48px;
            height: 48px;
            padding: 2px;
            border-radius: 50%;
            border: 2px solid var(--ink);
            background: rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        .class-pick img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .class-pick.on {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(233, 196, 106, 0.7);
        }

        .class-pick.locked img {
            opacity: 0.3;
            filter: grayscale(1);
        }

        .class-pick .icon {
            position: absolute;
            inset: 11px;
        }

        #class-info {
            min-height: 20px;
            margin-top: 4px;
            font-size: 13px;
            color: var(--bone-dim);
        }

        #class-info b {
            color: var(--bone);
            font-family: var(--font-display);
        }

        #class-info .icon {
            width: 14px;
            height: 14px;
            vertical-align: -2px;
        }

        .title-menu {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 22px;
        }

        .title-menu .btn {
            width: 100%;
        }

        .title-row {
            display: flex;
            gap: 10px;
        }

        .title-row .btn {
            font-size: 15px;
        }

        /* 並排的按鈕在窄螢幕上，一般按鈕的左右內距會把「圖示＋字」擠成兩行 */
        .title-row .btn,
        .btn-row .btn {
            flex: 1;
            padding-left: 8px;
            padding-right: 8px;
            white-space: nowrap;
        }

        .best-line {
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--bone-dim);
            font-size: 14px;
        }

        .best-line .icon {
            width: 20px;
            height: 20px;
        }

        .crystal-count {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-family: var(--font-display);
            font-weight: 900;
            color: #d1b3ff;
        }

        .crystal-count .icon {
            width: 18px;
            height: 18px;
        }

        /* 祝福三選一 */
        #draft-screen .title-text {
            font-size: 26px;
            margin-bottom: 16px;
        }

        #draft-cards {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 560px;
            justify-content: center;
        }

        .draft-card {
            flex: 1;
            max-width: 170px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px 14px;
            cursor: pointer;
            font-family: var(--font-ui);
            animation: card-in 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
        }

        /* 傳說祝福：金框＋金光＋暖色底，一眼看出比較稀有 */
        .draft-card.legendary {
            background: linear-gradient(#4a3418, #241a0e);
            box-shadow:
                inset 0 0 0 2px #ffd54f,
                inset 0 0 0 4px var(--ink),
                inset 0 0 24px rgba(255, 213, 79, 0.25),
                0 0 22px rgba(255, 213, 79, 0.55),
                0 12px 32px rgba(0, 0, 0, 0.6);
        }

        .draft-card.legendary .draft-name {
            color: #ffe082;
        }

        .draft-card:nth-child(2) {
            animation-delay: 0.08s;
        }

        .draft-card:nth-child(3) {
            animation-delay: 0.16s;
        }

        .draft-card:active {
            transform: scale(0.96);
        }

        .draft-card .card-icon {
            width: 64px;
            height: 64px;
            padding: 6px;
            border-radius: 50%;
            background: radial-gradient(rgba(233, 196, 106, 0.25), rgba(0, 0, 0, 0));
        }

        .draft-name {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 17px;
            color: var(--gold);
            text-shadow: var(--text-outline);
        }

        .draft-desc {
            font-size: 13px;
            line-height: 1.35;
            color: var(--bone);
            min-height: 2.7em;
        }

        .pips {
            display: inline-flex;
            gap: 3px;
        }

        .pip {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 2px solid var(--ink);
            background: #3a3046;
        }

        .pip.on {
            background: var(--gold);
        }

        .pip.next {
            background: var(--gold);
            animation: blink 0.8s infinite alternate;
        }

        /* 多一張選項時排成 2×2，手機上四張並排會擠到每張只剩幾個字寬 */
        #draft-cards.four {
            display: grid;
            grid-template-columns: 1fr 1fr;
            max-width: 360px;
            justify-items: center;
        }

        #draft-cards.four .draft-card {
            width: 100%;
            gap: 5px;
            padding: 10px 8px;
        }

        /* 兩排卡片加上三顆按鈕，矮螢幕（約 670px 高）要剛好放得下 */
        #draft-cards.four .card-icon {
            width: 46px;
            height: 46px;
            padding: 4px;
        }

        /* 真的放不下時可以捲動，而且捲得到最上面（justify-content: center 溢出時上半截會捲不到） */
        #draft-screen {
            overflow-y: auto;
            justify-content: flex-start;
        }

        #draft-screen > :first-child {
            margin-top: auto;
        }

        #draft-screen > :last-child {
            margin-bottom: auto;
        }

        /* 流派標籤：頭像＋名字＋共鳴進度；選下去剛好湊滿一段時整個亮起來 */
        .school-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px 2px 3px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 2px solid var(--school, var(--bone-dim));
            font-size: 11px;
            font-weight: 700;
            color: var(--school, var(--bone));
            white-space: nowrap;
        }

        .school-chip.resonates {
            background: var(--gold);
            border-color: var(--gold);
            color: #3a2410;
            box-shadow: 0 0 12px rgba(233, 196, 106, 0.8);
            animation: blink 0.8s infinite alternate;
        }

        .school-img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex: none;
        }

        .res-pips .pip {
            width: 6px;
            height: 6px;
            border-width: 1.5px;
        }

        /* 卡片上：進度點自成一排，緊貼在流派標籤下面 */
        .draft-card .res-pips {
            margin-top: -5px;
        }

        .res-gap {
            width: 3px;
        }

        .card-banish {
            margin-top: 2px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px 8px;
            border-radius: 10px;
            border: 2px solid var(--ink);
            background: #3a3046;
            color: var(--bone-dim);
            font-family: var(--font-ui);
            font-size: 11px;
            cursor: pointer;
        }

        .card-banish .btn-icon {
            width: 14px;
            height: 14px;
        }

        #pause-resonance {
            margin-bottom: 6px;
        }

        .bless-row.res-row {
            border-color: var(--school);
        }

        .bless-row.res-row .school-img {
            width: 32px;
            height: 32px;
        }

        .bless-row.res-row .bless-effect b {
            color: var(--school);
        }

        /* 重抽、跳過、補滿血：窄螢幕放不下三顆就換行 */
        .draft-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 10px;
            margin-top: 18px;
            padding: 0 12px;
        }

        #reroll-btn,
        #skip-btn,
        #heal-btn {
            font-size: 15px;
        }

        /* 契約：暗紅框＋血光，跟金色的傳說一眼分得開；好處綠字、壞處紅字 */
        .draft-card.pact {
            background: linear-gradient(#3a1016, #1a080c);
            box-shadow:
                inset 0 0 0 2px #e53935,
                inset 0 0 0 4px var(--ink),
                inset 0 0 24px rgba(229, 57, 53, 0.25),
                0 0 22px rgba(229, 57, 53, 0.5),
                0 12px 32px rgba(0, 0, 0, 0.6);
        }

        .draft-card.pact .draft-name {
            color: #ff8a80;
        }

        .school-chip.pact-chip {
            border-color: #e53935;
            color: #ff8a80;
        }

        /* 每日變異不能用的兵種：整張卡變灰 */
        .unit-card.daily-locked {
            opacity: 0.35;
            filter: grayscale(1);
        }

        .boon,
        .bane {
            display: block;
        }

        .boon {
            color: #a5d6a7;
        }

        .bane {
            color: #ef9a9a;
        }

        /* 祝福列表（暫停 / 結算） */
        .bless-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .bless-chip {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 62px;
            gap: 2px;
            font-size: 11px;
            color: var(--bone-dim);
        }

        .bless-chip .icon {
            width: 40px;
            height: 40px;
        }

        .bless-chip b {
            position: absolute;
            top: -2px;
            right: 6px;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            background: var(--gold);
            border: 2px solid var(--ink);
            color: #3a2410;
            font-family: var(--font-display);
            font-size: 11px;
            line-height: 14px;
        }

        /* 暫停選單的祝福：每一行是圖示、名稱＋層數、累積效果 */
        .bless-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            text-align: left;
        }

        .bless-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--ink);
            min-width: 0;
        }

        .bless-row>.icon {
            flex: none;
            width: 32px;
            height: 32px;
        }

        .bless-row .bless-text {
            min-width: 0;
        }

        .bless-row .bless-name {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px 5px;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 13px;
            color: var(--bone);
        }

        .bless-row .nm {
            white-space: nowrap;
        }

        .bless-row .pip {
            width: 7px;
            height: 7px;
            border-width: 1.5px;
        }

        .bless-row .bless-effect {
            font-size: 11px;
            line-height: 1.3;
            color: #c5e1a5;
        }

        .bless-detail .empty-note {
            grid-column: 1 / -1;
            text-align: center;
        }

        .empty-note {
            color: var(--bone-dim);
            font-size: 13px;
        }

        /* 結算 */
        #game-over-screen .title-text {
            font-size: 36px;
            color: #ff7a6a;
            text-shadow: 0 3px 0 var(--ink), 0 0 16px rgba(224, 72, 72, 0.5);
        }

        /* 誰殺的：頭像框跟召喚卡的頭像同一套，紅框表示是敵人 */
        #final-killer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 2px 0 12px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 15px;
            color: var(--bone-dim);
        }

        #final-killer img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            padding: 3px;
            border-radius: 12px;
            background: radial-gradient(circle, rgba(224, 72, 72, 0.35), rgba(0, 0, 0, 0.35) 70%);
            border: 2px solid var(--ink);
            box-shadow: inset 0 0 0 1.5px #ff7a6a, 0 0 12px rgba(224, 72, 72, 0.45);
        }

        #final-killer b {
            margin: 0 4px;
            font-size: 19px;
            font-weight: 900;
            color: #ff8a80;
            text-shadow: var(--text-outline);
        }

        .result-wave {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 64px;
            line-height: 1;
            color: var(--bone);
            text-shadow: 0 4px 0 var(--ink);
        }

        .result-wave-label {
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--bone-dim);
            margin-bottom: 10px;
        }

        #best-wave-text {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-display);
            font-weight: 900;
            color: var(--bone-dim);
            min-height: 24px;
        }

        #best-wave-text.new-record {
            color: var(--gold);
            font-size: 18px;
            animation: pop 0.5s;
        }

        #best-wave-text .icon {
            width: 22px;
            height: 22px;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 14px 0;
        }

        .result-stat {
            flex: 1;
            max-width: 110px;
            padding: 8px 4px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--ink);
        }

        .result-stat b {
            display: block;
            font-family: var(--font-display);
            font-size: 20px;
            color: var(--bone);
        }

        .result-stat span {
            font-size: 11px;
            color: var(--bone-dim);
        }

        /* 通關時間：破紀錄時後面亮一個金色「新紀錄」，沒破就小字寫目前最快 */
        #victory-time .new-record {
            margin-left: 4px;
            color: var(--gold);
        }

        #victory-time .best-time {
            margin-left: 4px;
            font-size: 13px;
            color: var(--bone-dim);
        }

        .reward-line {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 6px 0 4px;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(179, 136, 255, 0.15);
            border: 2px solid rgba(179, 136, 255, 0.5);
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 18px;
            color: #e1d0ff;
        }

        .reward-line .icon {
            width: 24px;
            height: 24px;
        }

        .section-title {
            margin: 18px 0 8px;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 15px;
            color: var(--gold);
            text-shadow: var(--text-outline);
        }

        /* 設定滑桿 */
        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .setting-row .icon {
            width: 26px;
            height: 26px;
        }

        .setting-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 12px;
            border-radius: 6px;
            background: #120d18;
            border: 2px solid var(--ink);
            box-shadow: inset 0 0 0 1px var(--gold-deep);
            outline: none;
        }

        .setting-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(#f2cf73, #c4913a);
            border: 3px solid var(--ink);
            cursor: pointer;
        }

        .setting-row input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(#f2cf73, #c4913a);
            border: 3px solid var(--ink);
            cursor: pointer;
        }

        /* 設定開關（省電模式） */
        .setting-toggle {
            cursor: pointer;
        }

        .setting-toggle .setting-label {
            flex: 1;
            text-align: left;
            font-weight: 700;
            font-size: 17px;
            color: var(--bone);
            text-shadow: var(--text-outline);
        }

        .switch {
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            flex-shrink: 0;
            width: 52px;
            height: 28px;
            margin: 0;
            border-radius: 14px;
            background: #120d18;
            border: 2px solid var(--ink);
            box-shadow: inset 0 0 0 1px var(--gold-deep);
            cursor: pointer;
            transition: background 0.15s;
        }

        .switch::before {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(#f2cf73, #c4913a);
            border: 2px solid var(--ink);
            box-sizing: border-box;
            transition: transform 0.15s;
        }

        .switch:checked {
            background: #4f7a2a;
        }

        .switch:checked::before {
            transform: translateX(24px);
        }

        /* 統計 */
        .stat-grid {
            display: grid;
            gap: 8px;
        }

        .stat-grid.cols-3 {
            grid-template-columns: repeat(3, 1fr);
            max-width: 300px;
            margin: 0 auto;
        }

        .stat-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-cell img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .stat-cell b {
            font-family: var(--font-display);
            font-size: 15px;
        }


        /* 永久強化 */
        #meta-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 8px 8px 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--ink);
        }

        .meta-row>.icon {
            width: 38px;
            height: 38px;
        }

        .meta-info {
            flex: 1;
            min-width: 0;
        }

        .meta-name {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 15px;
        }

        .meta-desc {
            font-size: 12px;
            color: var(--bone-dim);
            margin-top: 2px;
        }

        .meta-row .btn {
            min-height: 40px;
            min-width: 72px;
            padding: 4px 10px;
            font-size: 15px;
            border-width: 2px;
        }

        .meta-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .meta-head h2 {
            margin: 0;
        }

        /* 確認視窗 */
        #confirm-dialog .overlay-content {
            max-width: 340px;
        }

        #confirm-text {
            white-space: pre-line;
            color: var(--bone);
            font-size: 15px;
            margin: 4px 0 6px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        /* ---------- 動畫 ---------- */
        @keyframes pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.45); }
            100% { transform: scale(1); }
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        @keyframes blink {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes nova-glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        @keyframes hint {
            0%, 100% { box-shadow: var(--btn-shadow), 0 0 0 0 rgba(233, 196, 106, 0.9); }
            50% { box-shadow: var(--btn-shadow), 0 0 0 8px rgba(233, 196, 106, 0); }
        }

        @keyframes card-in {
            from { opacity: 0; transform: perspective(600px) rotateY(90deg) scale(0.8); }
            to { opacity: 1; transform: perspective(600px) rotateY(0) scale(1); }
        }

        .screen-in {
            animation: screen-in 0.25s ease-out both;
        }

        @keyframes screen-in {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

<body>
    <!-- 量手機「字型大小」放大了幾倍用（見 game.js 的 cancelTextZoom） -->
    <span id="tz-probe" aria-hidden="true">字</span>
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
        <div id="hud-top">
            <div class="hud-chip hp-chip">
                <span class="chip-icon" data-icon="heart"></span>
                <div class="hp-bar">
                    <div id="hp-fill"></div>
                    <span id="player-health-info"></span>
                </div>
            </div>
            <div id="wave-plate">
                <span class="plate-icon" data-icon="skull"></span>
                <div>
                    <div id="wave-info"></div>
                    <div id="timer-info"></div>
                </div>
            </div>
            <div class="hud-right">
                <div class="hud-chip"><span class="chip-icon" id="currency-icon"></span><span id="souls-info">0</span></div>
                <div class="hud-chip crystal-chip"><span class="chip-icon" data-icon="crystal"></span><span id="crystals-info">0</span></div>
                <button id="pause-resume-btn" class="btn btn-dark"><span class="btn-icon" data-icon="pause"></span>暫停</button>
            </div>
        </div>

        <div id="hud-bottom">
            <div id="action-row">
                <button id="skip-wave-btn" class="btn btn-blue"><span class="btn-icon" data-icon="fastForward"></span>開戰</button>
                <button id="nova-btn"></button>
            </div>
            <!-- 兵種卡照這一局的職業產生（game.js 的 buildUnitCards） -->
            <div id="unit-cards"></div>
        </div>
    </div>

    <div id="message-area" class="panel"></div>
    <div id="achv-toast" class="panel"></div>

    <!-- 標題畫面 -->
    <div id="title-screen" class="overlay-screen">
        <h1 class="logo">亡靈狂潮</h1>
        <div class="logo-sub">UNDEAD FRENZY</div>
        <img class="title-hero" id="title-hero" src="player.png" alt="">
        <div id="class-picker"></div>
        <div id="class-info"></div>
        <div class="title-menu">
            <button id="title-continue-btn" class="btn btn-gold btn-big hidden"></button>
            <button id="title-start-btn" class="btn btn-green btn-big">開始遊戲</button>
            <button id="title-daily-btn" class="btn btn-red"></button>
            <div class="title-row">
                <button id="title-meta-btn" class="btn btn-dark"><span class="btn-icon" data-icon="crystal"></span>強化</button>
                <button id="title-achv-btn" class="btn btn-dark"><span class="btn-icon" data-icon="trophy"></span>成就</button>
                <button id="title-curse-btn" class="btn btn-red hidden"><span class="btn-icon" data-icon="skull"></span>詛咒</button>
                <button id="title-settings-btn" class="btn btn-dark"><span class="btn-icon" data-icon="gear"></span>設定</button>
            </div>
        </div>
        <div class="best-line" id="title-best"></div>
    </div>

    <!-- 永久強化 -->
    <div id="meta-screen" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <div class="meta-head">
                <h2 class="title-text">永久強化</h2>
                <span class="crystal-count" id="meta-crystals"></span>
            </div>
            <div class="meta-earn" id="meta-earn"></div>
            <div id="meta-list"></div>
            <div class="btn-row">
                <button id="meta-refund-btn" class="btn btn-dark"><span class="btn-icon" data-icon="reroll"></span>全部退還</button>
                <button id="meta-close-btn" class="btn btn-dark">返回</button>
            </div>
        </div>
    </div>

    <!-- 成就 -->
    <div id="achv-screen" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <div class="meta-head">
                <h2 class="title-text">成就</h2>
                <span class="crystal-count" id="achv-count"></span>
            </div>
            <div id="achv-tabs"></div>
            <div id="achv-list"></div>
            <div class="stack">
                <button id="achv-close-btn" class="btn btn-dark">返回</button>
            </div>
        </div>
    </div>

    <!-- 詛咒（通關後解鎖的自選難度） -->
    <div id="curse-screen" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <div class="meta-head">
                <h2 class="title-text">詛咒</h2>
                <span class="crystal-count" id="curse-mult"></span>
            </div>
            <div class="curse-stepper">
                <button id="curse-minus" class="btn btn-dark" aria-label="降低">−</button>
                <span id="curse-level">0</span>
                <button id="curse-plus" class="btn btn-red" aria-label="提高">+</button>
            </div>
            <div id="curse-list"></div>
            <div class="stack">
                <button id="curse-close-btn" class="btn btn-dark">返回</button>
            </div>
        </div>
    </div>

    <!-- 通關 -->
    <div id="victory-screen" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <div class="title-text victory">凱旋</div>
            <div class="victory-sub">擊敗最終首領</div>
            <div class="reward-line" id="victory-time"></div>
            <div class="reward-line" id="victory-reward"></div>
            <div class="reward-line curse-unlock hidden" id="victory-unlock"></div>
            <div class="stack">
                <button id="victory-continue-btn" class="btn btn-red btn-big"><span class="btn-icon" data-icon="flame"></span>挑戰無盡</button>
                <button id="victory-end-btn" class="btn btn-gold"><span class="btn-icon" data-icon="trophy"></span>結算</button>
            </div>
        </div>
    </div>

    <!-- 設定（標題畫面用） -->
    <div id="settings-screen" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <h2 class="title-text">設定</h2>
            <div class="setting-row"><span data-icon="music"></span><input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" aria-label="音樂音量"></div>
            <div class="setting-row"><span data-icon="speaker"></span><input type="range" id="sfx-slider" min="0" max="1" step="0.01" value="0.5" aria-label="音效音量"></div>
            <label class="setting-row setting-toggle"><span data-icon="battery"></span><span class="setting-label">省電模式</span><input type="checkbox" id="saver-toggle" class="switch"></label>
            <div class="stack">
                <button id="settings-close-btn" class="btn btn-dark">返回</button>
            </div>
        </div>
    </div>

    <!-- 祝福三選一 -->
    <div id="draft-screen" class="overlay-screen">
        <div class="title-text">選擇祝福</div>
        <div id="draft-cards"></div>
        <div class="draft-actions">
            <button id="reroll-btn" class="btn btn-blue"></button>
            <button id="skip-btn" class="btn btn-dark"></button>
            <button id="heal-btn" class="btn btn-green"></button>
        </div>
    </div>

    <!-- 暫停 -->
    <div id="pause-menu" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <h2 class="title-text">暫停</h2>
            <div class="reward-line" id="pause-reward"></div>
            <div class="section-title">本局祝福</div>
            <div id="pause-resonance" class="bless-detail"></div>
            <div id="pause-blessings" class="bless-detail"></div>
            <div class="section-title">召喚</div>
            <div class="stat-grid cols-3" id="pause-summon-stats"></div>
            <div class="section-title">音量</div>
            <div class="setting-row"><span data-icon="music"></span><input type="range" id="pause-volume-slider" min="0" max="1" step="0.01" value="0.5" aria-label="音樂音量"></div>
            <div class="setting-row"><span data-icon="speaker"></span><input type="range" id="pause-sfx-slider" min="0" max="1" step="0.01" value="0.5" aria-label="音效音量"></div>
            <div class="section-title">畫面</div>
            <label class="setting-row setting-toggle"><span data-icon="battery"></span><span class="setting-label">省電模式</span><input type="checkbox" id="pause-saver-toggle" class="switch"></label>
            <div class="stack">
                <button id="resume-game-btn" class="btn btn-green btn-big"><span class="btn-icon" data-icon="play"></span>繼續</button>
                <div class="btn-row" style="margin-top:0">
                    <button id="pause-title-btn" class="btn btn-dark"><span class="btn-icon" data-icon="home"></span>標題</button>
                    <button id="restart-game-btn" class="btn btn-red"><span class="btn-icon" data-icon="close"></span>結束這局</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 結算 -->
    <div id="game-over-screen" class="overlay-screen">
        <div id="game-over-content" class="overlay-content panel screen-in">
            <div class="title-text" id="gameover-title">陣亡</div>
            <div id="final-killer" class="hidden"><img alt=""><span>被<b></b>擊倒</span></div>
            <div class="result-wave" id="final-wave-text">0</div>
            <div class="result-wave-label">撐過的波數</div>
            <div id="best-wave-text"></div>
            <div class="result-stats">
                <div class="result-stat"><b id="final-kills">0</b><span>擊殺</span></div>
                <div class="result-stat"><b id="final-summons">0</b><span>召喚</span></div>
                <div class="result-stat"><b id="final-streak">0</b><span>最高連殺</span></div>
            </div>
            <div class="reward-detail" id="final-reward-detail"></div>
            <div class="reward-line" id="final-reward"></div>
            <div id="final-blessings" class="bless-list" style="margin-top:12px"></div>
            <div class="stack">
                <button id="restart-button" class="btn btn-green btn-big">再戰一局</button>
                <div class="btn-row" style="margin-top:0">
                    <button id="gameover-title-btn" class="btn btn-dark"><span class="btn-icon" data-icon="home"></span>標題</button>
                    <button id="gameover-meta-btn" class="btn btn-dark"><span class="btn-icon" data-icon="crystal"></span>強化</button>
                </div>
            </div>
        </div>
    </div>

    <div id="hold-combo" aria-hidden="true"><span class="hc-art"></span><span class="hc-x">×</span><b class="hc-n">0</b></div>

    <!-- 確認 -->
    <div id="confirm-dialog" class="overlay-screen" style="z-index:20">
        <div class="overlay-content panel screen-in">
            <h2 class="title-text" id="confirm-title"></h2>
            <p id="confirm-text"></p>
            <div class="btn-row">
                <button id="confirm-no" class="btn btn-dark">取消</button>
                <button id="confirm-yes" class="btn btn-red">確定</button>
            </div>
        </div>
    </div>

    <audio id="bgm" loop src="background.mp3"></audio>

    <script src="icons.js"></script>
    <script src="achievement-icons.js"></script>
    <script src="game.js"></script>
    <script src="warrior.js"></script>
    <script src="druid.js"></script>
    <script src="vampire.js"></script>
    <script src="elf.js"></script>
</body>

</html>
