<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>亡靈狂潮 (Undead Frenzy)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description" content="體驗黑暗奇幻生存！《亡靈狂潮》讓你扮演死靈法師，召喚不死生物對抗怪物潮。收集靈魂、強化僕從，挑戰你的生存極限！">
    <meta name="theme-color" content="#1a1622">
    <style>
        * {
            touch-action: manipulation;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
        }

        body {
            position: fixed;
            inset: 0;
            background-color: #1a1622;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ---------- 遊戲畫面鋪滿整個螢幕 ---------- */
        #gameCanvas {
            position: fixed;
            inset: 0;
            display: block;
            touch-action: none;
            background-color: #2b2822;
        }

        /* ---------- 上方狀態列（浮在畫面上） ---------- */
        #hud-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            padding: calc(env(safe-area-inset-top) + 6px) 8px 14px;
            background: linear-gradient(rgba(10, 6, 16, 0.6), rgba(10, 6, 16, 0));
            pointer-events: none;
        }

        .hud-pill {
            background: rgba(10, 6, 16, 0.5);
            border-radius: 12px;
            padding: 4px 10px;
            font-weight: bold;
            font-size: 15px;
            line-height: 1.25;
            text-shadow: 0 1px 2px #000;
        }

        #hp-pill {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hp-bar {
            width: 64px;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        #hp-fill {
            height: 100%;
            width: 100%;
            background: #66BB6A;
            transition: width 0.15s;
        }

        #hp-fill.mid {
            background: #FFC107;
        }

        #hp-fill.low {
            background: #F44336;
        }

        #player-health-info {
            font-size: 13px;
        }

        #wave-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        #timer-info {
            font-size: 12px;
            font-weight: normal;
            color: #E0E0E0;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        #pause-resume-btn {
            pointer-events: auto;
            min-height: 30px;
            padding: 4px 10px;
            font-size: 13px;
            border-radius: 12px;
            background: rgba(10, 6, 16, 0.55);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* ---------- 下方操作區（浮在畫面上） ---------- */
        #hud-bottom {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 0 8px calc(env(safe-area-inset-bottom) + 8px);
            pointer-events: none;
        }

        #action-row {
            position: relative;
            width: 100%;
            max-width: 560px;
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #skip-wave-btn {
            pointer-events: auto;
            border-radius: 20px;
            padding: 8px 20px;
            background-color: #1565C0;
            border-color: #42A5F5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        #nova-btn {
            pointer-events: auto;
            position: absolute;
            right: 0;
            bottom: 0;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 14px;
            line-height: 1.15;
            background: rgba(20, 16, 30, 0.7);
            border: 2px solid rgba(206, 147, 216, 0.4);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        #nova-btn {
            flex-direction: column;
            gap: 1px;
        }

        .nova-icon {
            font-size: 24px;
            line-height: 1;
        }

        #nova-btn.nova-ready {
            background: radial-gradient(circle, #9C27B0, #6A1B9A);
            border-color: #E1BEE7;
            box-shadow: 0 0 14px rgba(206, 147, 216, 0.8);
        }

        #unit-cards {
            pointer-events: auto;
            width: 100%;
            max-width: 560px;
            display: flex;
            gap: 6px;
        }

        .unit-card {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 6px;
            background: rgba(20, 16, 30, 0.66);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(206, 147, 216, 0.3);
            border-radius: 12px;
        }

        .unit-head {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 34px;
        }

        .unit-icon {
            width: 34px;
            height: 34px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .unit-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            line-height: 1.15;
        }

        .unit-label {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .stats-label {
            font-size: 12px;
            color: #E0E0E0;
            white-space: nowrap;
        }

        .stars {
            color: #FFD54F;
        }

        .next-evo {
            font-size: 0.85em;
            color: #9E9E9E;
        }

        .unit-count {
            position: absolute;
            top: 0;
            right: 2px;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 1px 2px #000;
        }

        .unit-btns {
            display: flex;
            gap: 4px;
        }

        .unit-btns button {
            flex: 1;
            min-height: 42px;
            padding: 3px 2px;
            font-size: 13px;
            border-radius: 8px;
        }

        /* ---------- 按鈕共用 ---------- */
        button {
            padding: 6px 4px;
            font-size: 14px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            min-width: 0;
            min-height: 40px;
            border: 1px solid #888;
            background-color: #555;
            color: white;
            border-radius: 6px;
            transition: background-color 0.1s, border-color 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.1;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            white-space: pre-wrap;
        }

        button:active {
            background-color: #777;
        }

        button.can-afford {
            background-color: #689F38;
            border: 1px solid #9CCC65;
            color: #FFFFFF;
        }

        button.can-afford:active {
            background-color: #8BC34A;
        }

        button:disabled {
            background-color: rgba(66, 66, 66, 0.8);
            border: 1px solid #616161;
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message-area {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 70px);
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 15px;
            display: none;
            z-index: 5;
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
        }

        /* ---------- 彈窗（祝福 / 暫停 / 結算） ---------- */
        #draft-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .draft-card {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 12px;
            min-height: 72px;
            text-align: left;
            background-color: #3d3550;
            border: 1px solid #7E57C2;
            border-radius: 8px;
            white-space: normal;
        }

        .draft-card:active,
        .draft-card:hover {
            background-color: #4e4468;
            border-color: #FFD54F;
        }

        .draft-icon {
            font-size: 34px;
            line-height: 1;
            flex-shrink: 0;
        }

        .draft-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .draft-name {
            font-size: clamp(16px, 4vw, 18px);
            color: #FFD54F;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .draft-desc {
            font-size: clamp(14px, 3.4vw, 15px);
            font-weight: normal;
            color: #E0E0E0;
        }

        .pips {
            display: inline-flex;
            gap: 3px;
        }

        .pip {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid #9E9E9E;
        }

        .pip.on {
            background-color: #FFD54F;
            border-color: #FFD54F;
        }

        .pip.next {
            background-color: #FFD54F;
            border-color: #FFF;
            animation: pip-blink 0.8s infinite alternate;
        }

        @keyframes pip-blink {
            from {
                opacity: 0.3;
            }

            to {
                opacity: 1;
            }
        }

        .bless-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .bless-chip {
            background-color: #3d3550;
            border: 1px solid #7E57C2;
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 14px;
        }

        #restart-confirm-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #333;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            max-width: 300px;
            width: 90%;
        }

        #restart-confirm-dialog h3 {
            margin: 0 0 15px 0;
            color: #ff6b6b;
        }

        #restart-confirm-dialog .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        #restart-confirm-dialog button {
            padding: 8px 20px;
            min-height: auto;
        }

        .overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            display: none;
            z-index: 10;
        }

        .overlay-content {
            background-color: #2d2838;
            padding: clamp(15px, 4vh, 25px);
            border-radius: 12px;
            max-height: 90vh;
            overflow-y: auto;
            width: 88%;
            max-width: 500px;
        }

        .overlay-content h2 {
            margin-top: 0;
            font-size: clamp(20px, 5vw, 24px);
            margin-bottom: clamp(15px, 3vh, 20px);
        }

        #game-over-content h2 {
            color: #FF5252;
        }

        #final-wave-text {
            font-size: clamp(18px, 4.5vw, 22px);
            font-weight: bold;
        }

        #best-wave-text {
            color: #BDBDBD;
        }

        #best-wave-text.new-record {
            color: #FFD54F;
            font-weight: bold;
            font-size: clamp(17px, 4vw, 20px);
        }

        #final-blessings {
            margin-top: 12px;
        }

        .overlay-content p {
            font-size: clamp(14px, 3vw, 16px);
            margin: 5px 0;
        }

        #restart-button,
        #restart-game-btn,
        #resume-game-btn {
            padding: clamp(10px, 2vh, 12px) clamp(20px, 5vw, 24px);
            font-size: clamp(16px, 3.5vw, 18px);
            margin-top: clamp(15px, 3vh, 20px);
            cursor: pointer;
            background-color: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            width: 100%;
        }

        #restart-game-btn {
            background-color: #d32f2f;
        }

        #restart-game-btn:hover {
            background-color: #f44336;
        }

        #restart-button:hover,
        #resume-game-btn:hover {
            background-color: #66BB6A;
        }

        .pause-section {
            margin-bottom: clamp(15px, 3vh, 20px);
            padding-bottom: clamp(10px, 2vh, 15px);
            border-bottom: 1px solid #555;
        }

        .pause-section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .pause-section h3 {
            font-size: clamp(16px, 4vw, 18px);
            margin-top: 0;
            margin-bottom: 10px;
            color: #9CCC65;
        }

        .pause-section h4 {
            font-size: clamp(15px, 3.5vw, 17px);
            margin-top: 12px;
            margin-bottom: 8px;
            color: #BA68C8;
        }

        .pause-section label {
            font-size: clamp(14px, 3vw, 16px);
            margin-right: 10px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .pause-section input[type="range"] {
            width: 60%;
            vertical-align: middle;
            cursor: pointer;
        }

        .stat-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 5px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .stat-row.images img {
            width: clamp(28px, 12vw, 64px);
            height: auto;
            object-fit: contain;
            margin-bottom: 3px;
        }

        img.tint-bloater {
            filter: sepia(1) hue-rotate(50deg) saturate(3);
        }

        img.tint-boss {
            filter: sepia(1) hue-rotate(230deg) saturate(2.5);
        }

        .stat-row.counts span {
            font-size: clamp(13px, 3vw, 15px);
            font-weight: bold;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud-top">
        <div class="hud-pill" id="hp-pill">
            <span>❤️</span>
            <div class="hp-bar">
                <div id="hp-fill"></div>
            </div>
            <span id="player-health-info"></span>
        </div>
        <div class="hud-pill" id="wave-pill">
            <span id="wave-info"></span>
            <span id="timer-info"></span>
        </div>
        <div class="hud-right">
            <div class="hud-pill"><span id="souls-info"></span></div>
            <button id="pause-resume-btn">⏸ 暫停</button>
        </div>
    </div>

    <div id="hud-bottom">
        <div id="action-row">
            <button id="skip-wave-btn">⏩ 開戰</button>
            <button id="nova-btn">💥 新星</button>
        </div>
        <div id="unit-cards">
            <div class="unit-card">
                <div class="unit-head">
                    <img src="skeleton_warrior.png" class="unit-icon" alt="">
                    <div class="unit-info">
                        <span class="unit-label">骷髏</span>
                        <span id="skel-level" class="stats-label">Lv 0</span>
                    </div>
                    <span class="unit-count">×<span id="skel-count">0</span></span>
                </div>
                <div class="unit-btns">
                    <button id="summon-skeleton-btn">召喚</button>
                    <button id="upgrade-skeleton-btn">升級</button>
                </div>
            </div>
            <div class="unit-card">
                <div class="unit-head">
                    <img src="wraith.png" class="unit-icon" alt="">
                    <div class="unit-info">
                        <span class="unit-label">怨靈</span>
                        <span id="wraith-level" class="stats-label">Lv 0</span>
                    </div>
                    <span class="unit-count">×<span id="wraith-count">0</span></span>
                </div>
                <div class="unit-btns">
                    <button id="summon-wraith-btn">召喚</button>
                    <button id="upgrade-wraith-btn">升級</button>
                </div>
            </div>
            <div class="unit-card">
                <div class="unit-head">
                    <img src="eye_monster.png" class="unit-icon" alt="">
                    <div class="unit-info">
                        <span class="unit-label">眼魔</span>
                        <span id="eye-monster-level" class="stats-label">Lv 0</span>
                    </div>
                    <span class="unit-count">×<span id="eye-monster-count">0</span></span>
                </div>
                <div class="unit-btns">
                    <button id="summon-eye-monster-btn">召喚</button>
                    <button id="upgrade-eye-monster-btn">升級</button>
                </div>
            </div>
        </div>
    </div>

    <div id="message-area"></div>

    <div id="game-over-screen" class="overlay-screen">
        <div id="game-over-content" class="overlay-content">
            <h2>遊戲結束</h2>
            <p id="final-wave-text">您存活了 0 波。</p>
            <p id="best-wave-text"></p>
            <p id="final-stats-text"></p>
            <div id="final-blessings" class="bless-list"></div>
            <button id="restart-button">重新開始</button>
        </div>
    </div>

    <div id="pause-menu" class="overlay-screen">
        <div id="pause-content" class="overlay-content">
            <h2>遊戲暫停</h2>
            <div class="pause-section">
                <h3>設定</h3>
                <label for="volume-slider">音樂音量:</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
                <br>
                <label for="sfx-slider">音效音量:</label>
                <input type="range" id="sfx-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="pause-section">
                <h3>祝福</h3>
                <div id="pause-blessings" class="bless-list"></div>
            </div>
            <div class="pause-section">
                <h3>統計數據</h3>
                <h4>總召喚量:</h4>
                <div class="stat-row images">
                    <div class="stat-item"><img src="skeleton_warrior.png" alt="骷髏戰士"></div>
                    <div class="stat-item"><img src="eye_monster.png" alt="眼魔"></div>
                    <div class="stat-item"><img src="wraith.png" alt="怨靈"></div>
                </div>
                <div class="stat-row counts">
                    <div class="stat-item"><span id="stat-summon-skel">0</span></div>
                    <div class="stat-item"><span id="stat-summon-eye">0</span></div>
                    <div class="stat-item"><span id="stat-summon-wraith">0</span></div>
                </div>
                <h4>總擊殺數:</h4>
                <div class="stat-row images">
                    <div class="stat-item"><img src="basic_melee.png" alt="基礎近戰"></div>
                    <div class="stat-item"><img src="fast_melee.png" alt="快速近戰"></div>
                    <div class="stat-item"><img src="basic_melee.png" class="tint-bloater" alt="腐屍"></div>
                    <div class="stat-item"><img src="armored_melee.png" alt="裝甲近戰"></div>
                    <div class="stat-item"><img src="armored_melee.png" class="tint-boss" alt="首領"></div>
                </div>
                <div class="stat-row counts">
                    <div class="stat-item"><span id="stat-kill-basic">0</span></div>
                    <div class="stat-item"><span id="stat-kill-fast">0</span></div>
                    <div class="stat-item"><span id="stat-kill-bloater">0</span></div>
                    <div class="stat-item"><span id="stat-kill-armored">0</span></div>
                    <div class="stat-item"><span id="stat-kill-boss">0</span></div>
                </div>
            </div>
            <button id="restart-game-btn">重新開始</button>
            <button id="resume-game-btn">繼續遊戲</button>
        </div>
    </div>

    <div id="draft-screen" class="overlay-screen">
        <div class="overlay-content">
            <h2>選擇一項祝福</h2>
            <div id="draft-cards"></div>
        </div>
    </div>

    <div id="restart-confirm-dialog">
        <h3>確認重新開始？</h3>
        <p>這將會清除目前的遊戲進度</p>
        <div class="button-group">
            <button id="restart-confirm-yes">確定</button>
            <button id="restart-confirm-no">取消</button>
        </div>
    </div>

    <audio id="bgm" loop src="background.mp3"></audio>

    <script src="game.js"></script>
</body>

</html>
