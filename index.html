                <button id="settings-close-btn" class="btn btn-dark">返回</button>
            </div>
        </div>
    </div>

    <!-- 安裝教學（瀏覽器不能直接叫出安裝視窗時） -->
    <div id="install-screen" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <h2 class="title-text">安裝成 App</h2>
            <ol id="install-steps" class="install-steps"></ol>
            <div id="install-note" class="install-note hidden"></div>
            <div class="stack">
                <button id="install-open-btn" class="btn btn-gold hidden"><span class="btn-icon" data-icon="browser"></span>用瀏覽器開啟</button>
                <button id="install-close-btn" class="btn btn-dark">返回</button>
            </div>
        </div>
    </div>

    <!-- 祝福三選一 -->
    <div id="draft-screen" class="overlay-screen">
        <div class="title-text" id="draft-title">選擇祝福</div>
        <div id="draft-cards"></div>
        <div class="draft-actions">
            <button id="reroll-btn" class="btn btn-blue"></button>
            <button id="heal-btn" class="btn btn-green"></button>
        </div>
    </div>

    <!-- 暫停 -->
    <div id="pause-menu" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <h2 class="title-text">暫停</h2>
            <div class="reward-line" id="pause-reward"></div>
            <div class="section-title">本局祝福</div>
            <div id="pause-blessings" class="bless-detail"></div>
            <div class="section-title">召喚</div>
            <div class="stat-grid cols-3" id="pause-summon-stats"></div>
            <div class="section-title">音量</div>
            <div class="setting-row"><span data-icon="music"></span><input type="range" id="pause-volume-slider" min="0" max="1" step="0.01" value="0.5" aria-label="音樂音量"></div>
            <div class="setting-row"><span data-icon="speaker"></span><input type="range" id="pause-sfx-slider" min="0" max="1" step="0.01" value="0.5" aria-label="音效音量"></div>
            <div class="section-title">畫面</div>
            <label class="setting-row setting-toggle"><span data-icon="battery"></span><span class="setting-label">省電模式</span><input type="checkbox" id="pause-saver-toggle" class="switch"></label>
            <label class="setting-row setting-toggle"><span data-icon="reduceShake"></span><span class="setting-label">減少晃動</span><input type="checkbox" id="pause-shake-toggle" class="switch"></label>
            <label class="setting-row setting-toggle"><span data-icon="fullscreen"></span><span class="setting-label">全螢幕</span><input type="checkbox" id="pause-fullscreen-toggle" class="switch"></label>
            <div class="stack">
                <button id="pause-guide-btn" class="btn btn-dark"><span class="btn-icon" data-icon="classGuide"></span>職業玩法</button>
                <button id="resume-game-btn" class="btn btn-green btn-big"><span class="btn-icon" data-icon="play"></span>繼續</button>
                <div class="btn-row" style="margin-top:0">
                    <button id="pause-title-btn" class="btn btn-dark"><span class="btn-icon" data-icon="home"></span>標題</button>
                    <button id="restart-game-btn" class="btn btn-red"><span class="btn-icon" data-icon="close"></span>結束這局</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 結算 -->
    <div id="game-over-screen" class="overlay-screen">
        <div id="game-over-content" class="overlay-content panel screen-in">
            <div class="title-text" id="gameover-title">陣亡</div>
            <div id="final-killer" class="hidden"><img alt=""><span>被<b></b>擊倒</span></div>
            <div class="result-wave" id="final-wave-text">0</div>
            <div class="result-wave-label">撐過的波數</div>
            <div id="best-wave-text"></div>
            <button id="final-target" class="final-target hidden"></button>
            <div class="result-stats">
                <div class="result-stat"><b id="final-kills">0</b><span>擊殺</span></div>
                <div class="result-stat"><b id="final-summons">0</b><span>召喚</span></div>
            </div>
            <div class="reward-detail" id="final-reward-detail"></div>
            <div class="reward-line" id="final-reward"></div>
            <div id="final-blessings" class="bless-list" style="margin-top:12px"></div>
            <div class="stack">
                <button id="restart-button" class="btn btn-green btn-big">再戰一局</button>
                <div class="btn-row" style="margin-top:0">
                    <button id="gameover-title-btn" class="btn btn-dark"><span class="btn-icon" data-icon="home"></span>標題</button>
                    <button id="gameover-meta-btn" class="btn btn-dark"><span class="btn-icon" data-icon="gold"></span>強化</button>
                    <button id="gameover-lb-btn" class="btn btn-dark"><span class="btn-icon" data-icon="podium"></span>排行</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 排行榜：綜合與各職業各前十名 -->
    <div id="lb-screen" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <h2 class="title-text">排行榜</h2>
            <div id="lb-tabs"></div>
            <div id="lb-list"></div>
            <div class="stack">
                <button id="lb-close-btn" class="btn btn-dark">返回</button>
            </div>
        </div>
    </div>

    <!-- 排行榜上某一筆的詳細資料 -->
    <div id="lb-detail" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <div id="lb-detail-body"></div>
            <div class="stack">
                <button id="lb-detail-close-btn" class="btn btn-dark">返回</button>
            </div>
        </div>
    </div>

    <!-- 結算時上榜：恭喜＋留名字 -->
    <!-- 職業玩法介紹：標題「玩法介紹」、暫停選單、第一次用某個職業開局時 -->
    <div id="class-guide" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <div class="cg-head"><img id="cg-portrait" src="" alt=""><div><div class="cg-name" id="cg-name"></div><div class="cg-tagline" id="cg-tagline"></div></div></div>
            <div class="section-title">怎麼玩</div>
            <ul class="cg-rules" id="cg-rules"></ul>
            <div class="section-title">底部三張卡</div>
            <div class="cg-cards" id="cg-cards"></div>
            <div class="section-title">大招</div>
            <div class="cg-cards" id="cg-ult"></div>
            <div class="stack">
                <button id="cg-ok-btn" class="btn btn-gold btn-big">知道了</button>
            </div>
        </div>
    </div>

    <div id="lb-congrats" class="overlay-screen">
        <div class="overlay-content panel screen-in">
            <button id="lb-congrats-close-btn" class="lb-x" aria-label="關閉"><span class="icon" data-icon="close"></span></button>
            <span class="icon lb-congrats-icon" data-icon="podium"></span>
            <h2 class="title-text" id="lb-congrats-title">恭喜上榜！</h2>
            <p id="lb-congrats-cheer" class="lb-cheer"></p>
            <div id="lb-congrats-ranks" class="lb-ranks"></div>
            <div id="lb-congrats-result"></div>
            <label class="lb-name-label" for="lb-name-input">名字</label>
            <input id="lb-name-input" type="text" maxlength="12" autocomplete="off" enterkeyhint="done">
            <div class="stack">
                <button id="lb-congrats-ok-btn" class="btn btn-gold btn-big">登錄</button>
            </div>
        </div>
    </div>


    <!-- 確認 -->
    <div id="confirm-dialog" class="overlay-screen" style="z-index:20">
        <div class="overlay-content panel screen-in">
            <h2 class="title-text" id="confirm-title"></h2>
            <p id="confirm-text"></p>
            <div class="btn-row">
                <button id="confirm-no" class="btn btn-dark">取消</button>
                <button id="confirm-yes" class="btn btn-red">確定</button>
            </div>
        </div>
    </div>

    <audio id="bgm" loop src="background.mp3"></audio>

    <script src="storage.js"></script>
    <script src="icons.js"></script>
    <script src="achievement-icons.js"></script>
    <script src="game.js"></script>
    <script src="warrior.js"></script>
    <script src="druid.js"></script>
    <script src="vampire.js"></script>
    <script src="elf.js"></script>
    <script src="rogue.js"></script>
    <script src="monk.js"></script>
</body>

</html>
